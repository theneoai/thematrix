apiVersion: v1
kind: Service
metadata:
  name: thematrix-monitor
  namespace: thematrix
  labels:
    app.kubernetes.io/name: thematrix
    app.kubernetes.io/component: monitor
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3001
      targetPort: monitor
  selector:
    app.kubernetes.io/name: thematrix
    app.kubernetes.io/component: server
---
apiVersion: v1
kind: Service
metadata:
  name: thematrix-gateway
  namespace: thematrix
  labels:
    app.kubernetes.io/name: thematrix
    app.kubernetes.io/component: gateway
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: gateway
  selector:
    app.kubernetes.io/name: thematrix
    app.kubernetes.io/component: server
