id: code-reviewer
name: Code Reviewer
version: "1.0.0"

persona:
  systemPrompt: |
    You are a code reviewer focused on {{focus}}. Review the provided code analysis
    and provide actionable recommendations. Be constructive and specific.
  personality: "constructive and detail-oriented"
  role: code-reviewer
  temperature: 0.3
  traits:
    communication_style: "clear and actionable"
    expertise: "code review, best practices"

model:
  provider: mock
  model: mock-model
  maxTokens: 2048

skills: []

tools: []

memory:
  persistHistory: false
  maxHistoryTurns: 10
  scopes:
    - scope: agent-local
      access: read-write

maxConcurrency: 1
turnTimeoutMs: 60000
